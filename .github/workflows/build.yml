name: Build Modules
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:
    inputs:
      target:
        description: "Patch variant to build"
        type: choice
        options:
          - all
          - piko
          - piko-newx
        default: all
      twitter_version:
        description: "Twitter APK version (e.g. 'auto', '12.19.1-release.0', '12.25.0-prod.01')"
        type: string
        required: false
        default: "auto"
      patches_version:
        description: "Patches release version (e.g. 'latest', 'v3.9.0', 'v3.19.1')"
        type: string
        required: false
        default: "latest"
      included_patches:
        description: "Custom included patches to apply (optional, e.g. 'Bring back twitter')"
        type: string
        required: false
        default: ""
      force_all:
        description: "Force build regardless of update checks"
        type: boolean
        default: false

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Python
        run: pip install --no-cache-dir cloudscraper beautifulsoup4

      - name: Apply custom inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 configure_build.py \
            --target "${{ inputs.target || 'all' }}" \
            --twitter-version "${{ inputs.twitter_version || 'auto' }}" \
            --patches-version "${{ inputs.patches_version || 'latest' }}" \
            --included-patches "${{ inputs.included_patches || '' }}"
          
          if [ "${{ inputs.target }}" != "all" ] || \
             [ -n "${{ inputs.twitter_version }}" -a "${{ inputs.twitter_version }}" != "auto" ] || \
             [ -n "${{ inputs.patches_version }}" -a "${{ inputs.patches_version }}" != "latest" ] || \
             [ -n "${{ inputs.included_patches }}" ] || \
             [ "${{ inputs.force_all }}" = "true" ]; then
            echo "FORCE_BUILD=true" >> "$GITHUB_ENV"
          fi

      - name: Update config
        if: ${{ env.FORCE_BUILD != 'true' }}
        run: |
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ -n "$UPDATE_CFG" ]; then
              echo "$UPDATE_CFG" > config.json
            else
              echo "NO_UPDATES=true" >> "$GITHUB_ENV"
              echo "No updates detected for any modules."
            fi
          fi

      - name: Get next version code
        if: env.NO_UPDATES != 'true'
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -L 1 | awk -F '\t' '{print $3}')
          if [ -z "$TAG" ]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Build modules/APKs
        if: env.NO_UPDATES != 'true'
        run: if [ -f "config.json" ]; then ./build.sh config.json; else ./build.sh config.toml; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Get output
        if: env.NO_UPDATES != 'true'
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp
      
      - name: Upload release
        if: env.NO_UPDATES != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Release" --notes "$BODY"
            gh release upload "$TAG" ./build/* --clobber
          else
            gh release create "$TAG" ./build/* --title "Release" --notes "$BODY"
          fi

      - name: Update modules changelog and update json
        if: env.NO_UPDATES != 'true'
        id: update_config
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        if: env.NO_UPDATES != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add build.md *-update.json
      
          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi
